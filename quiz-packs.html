<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz - Trouve ton pack JCODE</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px; color: #ffffff; }
        .quiz-container { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); border-radius: 20px; border: 1px solid rgba(255, 255, 255, 0.1); padding: 40px; max-width: 700px; width: 100%; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3); }
        .progress-bar { width: 100%; height: 8px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; margin-bottom: 30px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 10px; transition: width 0.3s ease; }
        .question-number { font-size: 14px; color: rgba(255, 255, 255, 0.7); margin-bottom: 10px; }
        .question-title { font-size: 32px; font-weight: 700; margin-bottom: 30px; line-height: 1.2; }
        .answers { display: flex; flex-direction: column; gap: 15px; }
        .answer-btn { background: rgba(255, 255, 255, 0.1); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 12px; padding: 20px 25px; color: #ffffff; font-size: 18px; cursor: pointer; transition: all 0.3s ease; text-align: left; font-weight: 500; }
        .answer-btn:hover, .answer-btn:focus { background: rgba(99, 102, 241, 0.2); border-color: #6366f1; transform: translateX(5px); outline: none; }
        .answer-btn:focus-visible { outline: 3px solid #6366f1; outline-offset: 2px; }
        .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; gap: 15px; }
        .back-btn, .close-btn { background: transparent; border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px; padding: 12px 25px; color: #ffffff; font-size: 16px; cursor: pointer; transition: all 0.3s ease; }
        .back-btn:hover, .close-btn:hover { background: rgba(255, 255, 255, 0.1); border-color: rgba(255, 255, 255, 0.5); }
        .results { display: none; }
        .result-title { font-size: 28px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .result-subtitle { font-size: 16px; color: rgba(255, 255, 255, 0.8); margin-bottom: 30px; text-align: center; }
        .pack-card { background: rgba(255, 255, 255, 0.05); border: 2px solid rgba(255, 255, 255, 0.2); border-radius: 16px; padding: 30px; margin-bottom: 20px; transition: all 0.3s ease; }
        .pack-card.recommended { background: rgba(99, 102, 241, 0.15); border-color: #6366f1; border-width: 3px; position: relative; }
        .recommended-badge { position: absolute; top: -12px; left: 50%; transform: translateX(-50%); background: linear-gradient(90deg, #6366f1, #8b5cf6); color: #ffffff; padding: 6px 20px; border-radius: 20px; font-size: 14px; font-weight: 700; text-transform: uppercase; }
        .pack-name { font-size: 24px; font-weight: 700; margin-bottom: 10px; text-align: center; }
        .pack-price { font-size: 42px; font-weight: 700; color: #6366f1; text-align: center; margin-bottom: 15px; }
        .pack-price span { font-size: 16px; color: rgba(255, 255, 255, 0.7); }
        .pack-desc { font-size: 16px; color: rgba(255, 255, 255, 0.9); text-align: center; margin-bottom: 20px; line-height: 1.5; }
        .pack-btn { display: block; width: 100%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border: none; border-radius: 10px; padding: 16px; color: #ffffff; font-size: 18px; font-weight: 600; cursor: pointer; text-align: center; text-decoration: none; transition: all 0.3s ease; }
        .pack-btn:hover { transform: translateY(-2px); box-shadow: 0 10px 30px rgba(99, 102, 241, 0.4); }
        .all-packs-link { display: block; text-align: center; color: rgba(255, 255, 255, 0.7); font-size: 16px; margin-top: 20px; text-decoration: none; transition: color 0.3s ease; }
        .all-packs-link:hover { color: #ffffff; }
        .hidden { display: none; }
        @media (max-width: 600px) { .quiz-container { padding: 25px; } .question-title { font-size: 24px; } .answer-btn { font-size: 16px; padding: 16px 20px; } .pack-price { font-size: 32px; } }
    </style>
</head>
<body>
    <div class="quiz-container" role="main" aria-label="Quiz de recommandation de packs">
        <div class="progress-bar" role="progressbar" aria-valuenow="1" aria-valuemin="1" aria-valuemax="4">
            <div class="progress-fill" style="width: 25%"></div>
        </div>
        <div id="quiz-content">
            <div class="question-number" id="question-number">Question 1/4</div>
            <h2 class="question-title" id="question-title">Ton activité ?</h2>
            <div class="answers" id="answers"></div>
        </div>
        <div class="results" id="results" role="region" aria-label="Résultats du quiz"></div>
        <div class="nav-buttons" id="nav-buttons">
            <button class="back-btn hidden" id="back-btn" aria-label="Question précédente">Retour</button>
            <button class="close-btn" id="close-btn" aria-label="Fermer le quiz">Fermer</button>
        </div>
    </div>
    <script>
        const translations = {
            fr: { q1: "Ton activité ?", q2: "Tu as déjà un site ?", q3: "Ton objectif principal ?", q4: "Pour quand ?", a1: ["Restaurant", "Coiffure et beauté", "Commerce", "Autre"], a2: ["Non", "Oui", "Oui, mais il est à refaire"], a3: ["Être trouvé sur Google", "Recevoir des appels ou réservations", "Vendre en ligne", "Gagner du temps grâce à l'IA"], a4: ["Le plus vite possible", "Dans le mois", "Je me renseigne"], resTitle: "Ton pack idéal est trouvé !", resSub: "Basé sur tes réponses, voici notre recommandation", rec: "RECOMMANDÉ", alt: "Alternative", why: "Pourquoi ce pack ?", all: "Voir tous les packs", close: "Fermer", back: "Retour" },
            en: { q1: "Your business?", q2: "Do you already have a website?", q3: "Your main goal?", q4: "When do you need it?", a1: ["Restaurant", "Hair & Beauty", "Retail Shop", "Other"], a2: ["No", "Yes", "Yes, but needs redesign"], a3: ["Be found on Google", "Get calls or bookings", "Sell online", "Save time with AI"], a4: ["As soon as possible", "Within a month", "Just browsing"], resTitle: "Your ideal pack is found!", resSub: "Based on your answers, here's our recommendation", rec: "RECOMMENDED", alt: "Alternative", why: "Why this pack?", all: "View all packs", close: "Close", back: "Back" },
            nl: { q1: "Jouw activiteit?", q2: "Heb je al een website?", q3: "Je belangrijkste doel?", q4: "Wanneer heb je het nodig?", a1: ["Restaurant", "Kappers & Schoonheid", "Winkel", "Andere"], a2: ["Nee", "Ja", "Ja, maar moet vernieuwd worden"], a3: ["Gevonden worden op Google", "Oproepen of reserveringen ontvangen", "Online verkopen", "Tijd besparen met AI"], a4: ["Zo snel mogelijk", "Binnen een maand", "Ik oriënteer me"], resTitle: "Jouw ideale pakket is gevonden!", resSub: "Gebaseerd op je antwoorden, hier is onze aanbeveling", rec: "AANBEVOLEN", alt: "Alternatief", why: "Waarom dit pakket?", all: "Bekijk alle pakketten", close: "Sluiten", back: "Terug" }
        };
        const packs = {
            teaser: { name: { fr: "Teaser", en: "Teaser", nl: "Teaser" }, price: { fr: "399€", en: "€399", nl: "€399" }, period: { fr: "(paiement unique)", en: "(one-time)", nl: "(eenmalig)" }, link: "/#offre" },
            pro: { name: { fr: "Pro", en: "Pro", nl: "Pro" }, price: { fr: "539€", en: "€539", nl: "€539" }, period: { fr: "(paiement unique)", en: "(one-time)", nl: "(eenmalig)" }, link: "/#offre" },
            promax: { name: { fr: "Pro Max", en: "Pro Max", nl: "Pro Max" }, price: { fr: "1 139€", en: "€1,139", nl: "€1.139" }, period: { fr: "(paiement unique)", en: "(one-time)", nl: "(eenmalig)" }, link: "/#offre" },
            aiStarter: { name: { fr: "AI Concierge Starter", en: "AI Concierge Starter", nl: "AI Concierge Starter" }, price: { fr: "1 000€", en: "€1,000", nl: "€1.000" }, period: { fr: "/mois", en: "/month", nl: "/maand" }, link: "/ai-concierge.html" },
            aiPro: { name: { fr: "AI Concierge Pro", en: "AI Concierge Pro", nl: "AI Concierge Pro" }, price: { fr: "1 500€", en: "€1,500", nl: "€1.500" }, period: { fr: "/mois", en: "/month", nl: "/maand" }, link: "/ai-concierge.html" },
            marketingPro: { name: { fr: "Marketing Pro", en: "Marketing Pro", nl: "Marketing Pro" }, price: { fr: "24,90€", en: "€24.90", nl: "€24,90" }, period: { fr: "/mois", en: "/month", nl: "/maand" }, link: "/studio/marketing/" }
        };
        let currentQuestion = 0;
        let answers = {};
        let lang = document.documentElement.lang || 'fr';
        const questions = [{ key: 'activity', aKey: 'a1' }, { key: 'hasWebsite', aKey: 'a2' }, { key: 'goal', aKey: 'a3' }, { key: 'timing', aKey: 'a4' }];
        const qNumEl = document.getElementById('question-number');
        const qTitleEl = document.getElementById('question-title');
        const ansEl = document.getElementById('answers');
        const backBtn = document.getElementById('back-btn');
        const closeBtn = document.getElementById('close-btn');
        const resEl = document.getElementById('results');
        const progFill = document.querySelector('.progress-fill');
        const progBar = document.querySelector('.progress-bar');

        function init() {
            const urlLang = window.location.pathname.split('/')[1];
            if (urlLang === 'en') lang = 'en';
            else if (urlLang === 'nl') lang = 'nl';
            else lang = 'fr';
            
            /* jcode-ui-labels */
            const uiTxt = ({
                fr: { back: 'Retour', close: 'Fermer', backL: 'Question précédente', closeL: 'Fermer le quiz', resL: 'Résultats du quiz' },
                en: { back: 'Back', close: 'Close', backL: 'Previous question', closeL: 'Close quiz', resL: 'Quiz results' },
                nl: { back: 'Terug', close: 'Sluiten', backL: 'Vorige vraag', closeL: 'Quiz sluiten', resL: 'Quizresultaten' }
            })[lang];
            backBtn.textContent = uiTxt.back; backBtn.setAttribute('aria-label', uiTxt.backL);
            closeBtn.textContent = uiTxt.close; closeBtn.setAttribute('aria-label', uiTxt.closeL);
            resEl.setAttribute('aria-label', uiTxt.resL);
            showQuestion();
            setupEvents();
        }

        function t(key) { return translations[lang][key] || translations.fr[key]; }
        function withLang(l) { return (l.startsWith("/#") && lang !== "fr") ? "/" + lang + l : l; }

        function showQuestion() {
            const q = questions[currentQuestion];
            qNumEl.textContent = `Question ${currentQuestion + 1}/4`;
            qTitleEl.textContent = t(`q${currentQuestion + 1}`);
            ansEl.innerHTML = '';
            translations[lang][q.aKey].forEach((ans, idx) => {
                const btn = document.createElement('button');
                btn.className = 'answer-btn';
                btn.textContent = ans;
                btn.setAttribute('aria-label', ans);
                btn.onclick = () => selectAnswer(idx);
                ansEl.appendChild(btn);
            });
            progFill.style.width = `${((currentQuestion + 1) / 4) * 100}%`;
            progBar.setAttribute('aria-valuenow', currentQuestion + 1);
            currentQuestion === 0 ? backBtn.classList.add('hidden') : backBtn.classList.remove('hidden');
            setTimeout(() => { const first = ansEl.querySelector('.answer-btn'); if (first) first.focus(); }, 100);
        }

        function selectAnswer(idx) {
            answers[questions[currentQuestion].key] = idx;
            if (currentQuestion < questions.length - 1) { currentQuestion++; showQuestion(); } 
            else { showResults(); }
        }

        function showResults() {
            document.getElementById('quiz-content').style.display = 'none';
            document.getElementById('nav-buttons').style.display = 'none';
            resEl.style.display = 'block';
            const rec = getRecommendation();
            let html = `<h2 class="result-title">${t('resTitle')}</h2><p class="result-subtitle">${t('resSub')}</p>`;
            const rPack = packs[rec.rec];
            html += `<div class="pack-card recommended" role="article"><div class="recommended-badge">${t('rec')}</div><h3 class="pack-name">${rPack.name[lang]}</h3><div class="pack-price">${rPack.price[lang]} <span>${rPack.period[lang]}</span></div><p class="pack-desc">${rec.why}</p><a target="_top" href="${withLang(rPack.link)}" class="pack-btn">${t('why')} →</a></div>`;
            if (rec.alt) {
                const aPack = packs[rec.alt];
                html += `<div class="pack-card" role="article"><h3 class="pack-name">${aPack.name[lang]}</h3><div class="pack-price">${aPack.price[lang]} <span>${aPack.period[lang]}</span></div><a target="_top" href="${withLang(aPack.link)}" class="pack-btn" style="background: rgba(255,255,255,0.1)">${t('alt')} →</a></div>`;
            }
            html += `<a target="_top" href="/${lang === 'fr' ? '' : lang}/#offre" class="all-packs-link">${t('all')} →</a>`;
            resEl.innerHTML = html;
        }

        function getRecommendation() {
            const goal = answers.goal;
            let rec, alt, why;
            if (goal === 0) { rec = 'pro'; alt = 'teaser'; why = `Parfait pour ${translations[lang].a1[answers.activity].toLowerCase()} qui veut être trouvé sur Google rapidement.`; } 
            else if (goal === 1) { rec = 'pro'; alt = 'promax'; why = "Optimisé pour générer des appels et réservations automatiquement."; } 
            else if (goal === 2) { rec = 'promax'; alt = 'marketingPro'; why = "Solution complète pour vendre en ligne avec marketing vidéo inclus."; } 
            else if (goal === 3) { rec = 'aiPro'; alt = 'aiStarter'; why = "L'IA travaille pour vous 24/7 et répond à vos clients automatiquement."; }
            return { rec, alt, why: `${t('why')} ${why}` };
        }

        function setupEvents() {
            backBtn.onclick = () => { if (currentQuestion > 0) { currentQuestion--; showQuestion(); } };
            closeBtn.onclick = () => { window.close(); document.body.innerHTML = '<div style="text-align:center;padding:40px;color:white;"><h2>Quiz fermé</h2><p><a target="_top" href="/" style="color:#6366f1">Retour à l\'accueil</a></p></div>'; };
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeBtn.click(); });
        }
        init();
    </script>
</body>
</html>
