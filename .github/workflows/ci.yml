name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les liens internes des pages
        uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --include-verbatim "**/*.html"
          fail: true

      - name: Vérifier la présence des pages clés
        run: |
          test -f index.html
          test -f ai-concierge.html
          test -f espace-client.html
          test -f intake-form.html
          test -f mentions-legales.html
          test -f privacy_policy.html
          test -f terms.html
          test -f i18n/i18n.js
          test -f booking-widget.js
          test -f chatbot-widget.js
